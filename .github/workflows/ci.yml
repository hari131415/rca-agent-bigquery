name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Build the offline warehouse from the committed samples
        run: backend/.venv/bin/python scripts/seed_offline.py --from-sample
      - name: ruff format
        working-directory: backend
        run: .venv/bin/ruff format --check src tests ../data ../scripts
      - name: ruff check
        working-directory: backend
        run: .venv/bin/ruff check src tests ../data ../scripts
      - name: mypy
        # The mypy command must include src/: an earlier version of
        # this command omitted it, which let imports resolve silently
        # to Any and hid 45 real type errors.
        working-directory: backend
        run: .venv/bin/mypy src ../data ../scripts tests
      - name: pytest
        working-directory: backend
        run: .venv/bin/pytest -q
