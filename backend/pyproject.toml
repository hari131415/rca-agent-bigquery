[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-agent"
version = "0.1.0"
description = "AI root cause analysis agent for automotive quality investigations on BigQuery"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.110",
    "langgraph>=1.2",
    "pydantic>=2.0",
    "sqlglot>=26.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]
gcp = [
    "google-cloud-bigquery>=3.0",
    "google-cloud-firestore>=2.0",
    "google-genai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["rca_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
